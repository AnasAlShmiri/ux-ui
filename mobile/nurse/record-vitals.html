<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل العلامات الحيوية | تطبيق الممرض - يرعاني</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../assets/css/yerani-mint-theme.css">
    <script defer src="../../assets/js/yerani-ui.js"></script>
    <link rel="stylesheet" href="../../assets/css/visual-storytelling-v9.css">
    <script defer src="../../assets/js/visual-storytelling-v9.js"></script>
</head>

<body class="yr-v9">

    <div class="mobile-app-shell">

<!-- Mobile Status Bar -->
        

        <!-- Mobile Header -->
        <div class="mobile-header">
            <a href="visits.html" class="mobile-header-back" title="رجوع">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
            <h2 class="mobile-header-title">تسجيل العلامات الحيوية</h2>
            <a href="home.html" class="mobile-header-action" title="الرئيسية">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
            </a>
        </div>

        <!-- Mobile Content -->
        <div class="mobile-content">

            <!-- Patient Header Card -->
            <div class="m-card" style="background: #ECFAF6; border-color: #E2E8F0;">
                <div class="d-flex align-center justify-between">
                    <div class="d-flex align-center gap-xs">
                        <div class="avatar avatar-md" style="background: #FEF3C7; color: #D97706;">
                            <span>س.أ</span>
                        </div>
                        <div>
                            <h4 style="font-size: 0.95rem; margin-bottom: 2px;">سارة أحمد الشمري</h4>
                            <span class="text-xs text-muted">ملف #YR-8902 • زيارة منزلية حالية</span>
                        </div>
                    </div>
                    <span class="badge badge-warning text-xs">جاري التسجيل</span>
                </div>
            </div>

            <!-- Vitals Form Container -->
            <div class="m-card">
                <h3 style="font-size: 0.92rem; font-weight: 800; color: #1F2D2A; margin-bottom: 1rem;">
                    🩺 القياسات السريرية الميدانية
                </h3>

                <form action="submit-report.html" method="GET">

                    <!-- Blood Pressure -->
                    <div class="m-form-group">
                        <div class="d-flex justify-between mb-1">
                            <label class="m-form-label mb-0" style="font-size: 0.78rem;">ضغط الدم (Blood
                                Pressure)</label>
                            <span class="text-xs text-success font-semibold">المعدل الطبيعي: 120/80</span>
                        </div>
                        <div class="d-grid grid-2 gap-xs">
                            <input type="number" class="m-form-input text-center font-bold" value="124"
                                placeholder="انقباضي (120)" required>
                            <input type="number" class="m-form-input text-center font-bold" value="82"
                                placeholder="انبساطي (80)" required>
                        </div>
                    </div>

                    <!-- Pulse Rate & Temp -->
                    <div class="d-grid grid-2 gap-xs mb-3">
                        <div>
                            <div class="d-flex justify-between mb-1">
                                <label class="m-form-label mb-0" style="font-size: 0.75rem;">النبض (bpm)</label>
                                <span class="text-xs text-muted">60-100</span>
                            </div>
                            <input type="number" class="m-form-input text-center font-bold" value="74" required>
                        </div>

                        <div>
                            <div class="d-flex justify-between mb-1">
                                <label class="m-form-label mb-0" style="font-size: 0.75rem;">الحرارة (°C)</label>
                                <span class="text-xs text-muted">36.5-37.2</span>
                            </div>
                            <input type="text" class="m-form-input text-center font-bold" value="36.8" required>
                        </div>
                    </div>

                    <!-- Blood Sugar & SpO2 -->
                    <div class="d-grid grid-2 gap-xs mb-3">
                        <div>
                            <div class="d-flex justify-between mb-1">
                                <label class="m-form-label mb-0" style="font-size: 0.75rem;">السكر العشوائي
                                    (mg/dL)</label>
                                <span class="text-xs text-muted">&lt;140</span>
                            </div>
                            <input type="number" class="m-form-input text-center font-bold" value="98" required>
                        </div>

                        <div>
                            <div class="d-flex justify-between mb-1">
                                <label class="m-form-label mb-0" style="font-size: 0.75rem;">الأكسجين (SpO2 %)</label>
                                <span class="text-xs text-muted">95-100</span>
                            </div>
                            <input type="number" class="m-form-input text-center font-bold" value="99" required>
                        </div>
                    </div>

                    <!-- Medication Compliance Check -->
                    <div class="p-2 mb-3" style="background: #E4F4F0; border-radius: 10px; border: 1px solid #B4DFDD;">
                        <label class="m-form-label" style="font-size: 0.78rem; color: #11776D;">الالتزام الدوائي للوصفة
                            النشطة (Concor 2.5mg):</label>
                        <div class="d-flex gap-xs mt-1">
                            <label class="m-slot-btn active" style="flex: 1; font-size: 0.78rem;">
                                ✓ نعم، أخذت الجرعة في موعدها
                            </label>
                            <label class="m-slot-btn" style="flex: 1; font-size: 0.78rem;">
                                ✗ لم تأخذ الجرعة
                            </label>
                        </div>
                    </div>

                    <!-- Nurse Notes -->
                    <div class="m-form-group">
                        <label class="m-form-label" style="font-size: 0.78rem;">ملاحظات الممرض الأولية للمريض</label>
                        <textarea class="m-form-textarea" rows="2"
                            style="font-size: 0.8rem;">المريضة بحالة مستقرة ومعنويات ممتازة، لا تشكو من دوخة أو هبوط ضغط، تم التأكيد عليها بشرب السوائل الكافية.</textarea>
                    </div>

                    <button type="submit" class="m-btn m-btn-primary" style="width: 100%; background: #D97706;">
                        حفظ المؤشرات والانتقال لرفع التقرير للطبيب ←
                    </button>
                </form>
            </div>

        </div>

        <!-- Nurse Bottom Navigation -->
        <nav class="mobile-bottom-nav">
            <a href="home.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span>الرئيسية</span>
            </a>

            <a href="visits.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                </svg>
                <span>الزيارات</span>
            </a>

            <a href="record-vitals.html" class="bottom-nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>
                <span>العلامات</span>
            </a>

            <a href="submit-report.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                <span>التقارير</span>
            </a>

            <a href="history.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span>السجل</span>
            </a>
        </nav>

    </div>

</body>

</html>
